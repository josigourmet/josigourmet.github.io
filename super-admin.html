<html lang="pt-br">
<head><style>

  font-family: "Optimistic";
  font-style: normal;

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Josi Doces - Fora de atendimento</title>
<style>
:root {
  --marrom-escuro: #3e2723; --marrom-medio: #5d4037; --creme-fundo: #fdf5e6; --destaque: #c8860a;
}
body { margin:0; font-family: system-ui,sans-serif; background: var(--creme-fundo); color: var(--marrom-escuro); }
.tela-bloqueio {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 18px;
  text-align: center;
}
/* ANIMAÇÃO CONFEITEIRA */
.anim-wrap {
  width: 240px;
  height: 200px;
  position: relative;
  margin-bottom: 18px;
}
.bancada {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 12px;
  background: #8d6e63;
  border-radius: 6px;
}
.bowl {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 58px;
  background: #fff;
  border: 3px solid var(--marrom-medio);
  border-radius: 0 0 55px 55px;
  z-index: 2;
}
.massa {
  position: absolute;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  width: 92px;
  height: 28px;
  background: linear-gradient(#e2b07a, #d7a76f);
  border-radius: 0 0 40px 40px;
  z-index: 3;
  animation: massaMexendo 0.5s ease-in-out infinite alternate;
}
.fouet {
  position: absolute;
  bottom: 62px;
  left: 52%;
  font-size: 42px;
  z-index: 4;
  transform-origin: 18px 50px;
  animation: bater 0.35s ease-in-out infinite alternate;
}
.confeiteira {
  position: absolute;
  top: 10px;
  right: 26px;
  font-size: 64px;
  z-index: 1;
  animation: respirar 1.4s ease-in-out infinite;
}
.bolo-pronto {
  position: absolute;
  bottom: 30px;
  left: 18px;
  font-size: 38px;
  animation: boloPulinho 1.8s ease-in-out infinite;
  z-index: 2;
}
.sparkle { position: absolute; font-size: 18px; animation: brilho 1s infinite; }
.s1 { top: 0; left: 20px; animation-delay: 0s; }
.s2 { top: 15px; left: 0; animation-delay: 0.3s; }
.s3 { top: 5px; right: 10px; animation-delay: 0.6s; }

@keyframes bater {
  0% { transform: translateX(-50%) rotate(-28deg); }
  100% { transform: translateX(-50%) rotate(28deg); }
}
@keyframes massaMexendo {
  0% { transform: translateX(-50%) scaleX(1) rotate(-1deg); }
  100% { transform: translateX(-50%) scaleX(1.12) scaleY(0.9) rotate(1deg); }
}
@keyframes respirar { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }
@keyframes boloPulinho { 0%,100%{ transform: translateY(0) rotate(0);} 50%{ transform: translateY(-6px) rotate(2deg);} }
@keyframes brilho { 0%,100%{ opacity:0.2; transform: scale(0.7);} 50%{ opacity:1; transform: scale(1.2);} }

.titulo-fechado { font-size: 22px; font-weight: 800; color: var(--marrom-medio); margin: 8px 0 10px; }
.mensagem-cliente {
  background: #fff;
  border: 1.5px dashed #d7ccc8;
  border-radius: 16px;
  padding: 16px 18px;
  max-width: 360px;
  font-size: 16px;
  line-height: 1.45;
  box-shadow: 0 6px 18px rgba(62,39,35,.08);
}
.rodape { margin-top: 22px; font-size: 12px; opacity: 0.6; }
</style>
</head>
<body>
<div class="tela-bloqueio">
  <div class="anim-wrap">
    <div class="sparkle s1">✨</div>
    <div class="sparkle s2">✨</div>
    <div class="sparkle s3">✨</div>
    <div class="confeiteira">👩‍🍳</div>
    <div class="bolo-pronto">🎂</div>
    <div class="fouet">🥄</div>
    <div class="bowl"></div>
    <div class="massa"></div>
    <div class="bancada"></div>
  </div>

  <div class="titulo-fechado">Estamos com a cozinha fechada no momento</div>
  <div id="mensagemCliente" class="mensagem-cliente">Hoje não teremos atendimento. Pedimos desculpas pelo transtorno! 🤎</div>
  <div class="rodape">Josi Doces • feito com carinho 🤎</div>
</div>

</html>
